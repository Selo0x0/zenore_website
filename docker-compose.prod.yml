# Full production stack: postgres + api + web + caddy (reverse proxy, auto-HTTPS).
# The dev-only docker-compose.yml (postgres alone) is unaffected by this file.
#
# Usage:
#   cp .env.production.example .env.production   # fill in real values first
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# "name" pins this to its own Compose project so it never collides with
# docker-compose.yml's dev postgres container/volume, even though both files
# live at the repo root.
name: zenore-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: zenore-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: zenore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zenore-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Hits the existing DB-backed health route (app.controller.ts) rather
      # than just GET / — confirms the API can actually reach Postgres, not
      # just that the Node process is up.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health/database',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/zenore?schema=public
      CORS_ORIGIN: ${PUBLIC_SCHEME:-https}://${DOMAIN}
      UPLOADS_DIR: /app/uploads
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      SENTRY_DSN: ${SENTRY_DSN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
      PAYMENT_SECRET_KEY: ${PAYMENT_SECRET_KEY}
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_SCHEME:-https}://${DOMAIN}/api
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SCHEME:-https}://${DOMAIN}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    container_name: zenore-web
    restart: unless-stopped
    environment:
      # Server-side code (Server Components, Route Handlers) talks to the API
      # over Docker's internal network instead of round-tripping through the
      # public domain. This is a fixed internal value, not user-configurable.
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bugsink:
    image: bugsink/bugsink:2
    container_name: zenore-bugsink
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY}
      CREATE_SUPERUSER: ${BUGSINK_ADMIN_EMAIL}:${BUGSINK_ADMIN_PASSWORD}
      PORT: 8000
      DATABASE_URL: postgresql://bugsinkuser:${BUGSINK_DB_PASSWORD}@postgres:5432/bugsink
      BEHIND_HTTPS_PROXY: "true"
      USE_X_FORWARDED_HOST: "true"
      BASE_URL: ${PUBLIC_SCHEME:-https}://bugs.${DOMAIN:-localhost}

  caddy:
    image: caddy:2-alpine
    container_name: zenore-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${PUBLIC_SCHEME:-https}://${DOMAIN:-localhost}
      BUGSINK_SITE_ADDRESS: ${PUBLIC_SCHEME:-https}://bugs.${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      # bugsink has no healthcheck defined (third-party image, internals
      # not under our control) — just wait for the container to start.
      bugsink:
        condition: service_started

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
